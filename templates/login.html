<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FinTrack - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            width: 320px;
            box-shadow: 0 5px 25px #0001;
        }
        h1 { color: #2563eb; text-align: center; }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border-radius: 7px;
        }
        input { border: 1px solid #ccc; }
        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }
        p { text-align: center; }
    </style>
</head>
<body>
<div class="card">
    <h1>FinTrack</h1>
    <h2>Welcome Back</h2>
    <form method="POST">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
    <p>New user? <a href="/register">Create Account</a></p>
</div>
</body>
</html>
